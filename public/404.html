<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>404 · Eclipse Wasteland</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230f172a%22/%3E%3Ccircle cx=%2215%22 cy=%2216%22 r=%228.5%22 fill=%22%23f59e0b%22/%3E%3Ccircle cx=%2219.5%22 cy=%2212.5%22 r=%228%22 fill=%22%230f172a%22/%3E%3C/svg%3E" />
<style>
  :root { --accent: #f59e0b; --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px;
  }
  .card { text-align: center; max-width: 460px; }
  .code {
    font-size: 96px; font-weight: 800; line-height: 1; letter-spacing: -4px;
    color: var(--accent);
  }
  .code span { color: var(--muted); }
  h1 { font-size: 22px; margin: 18px 0 10px; }
  p { font-size: 14px; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
  a.btn {
    display: inline-block; padding: 10px 28px; border-radius: 10px;
    background: var(--accent); color: #fff; text-decoration: none;
    font-size: 15px; font-weight: 600; transition: opacity .15s;
  }
  a.btn:hover { opacity: .85; }
  .ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); margin-left: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="code">4<span>0</span>4</div>
  <h1>页面不存在</h1>
  <p>你访问的地址没有找到。内容可能已移动，或链接有误。</p>
  <a class="btn" href="/eclipse-wasteland/">返回首页</a>
  <a class="btn ghost" href="javascript:history.back()">返回上页</a>
</div>
</body>
</html>
